<div class="container mt-4" style="max-width: 500px;">
  <h2 class="mb-4">
    <i class="fa-solid" [class.fa-plus]="!isEditMode" [class.fa-pen]="isEditMode"></i>
    {{ isEditMode ? 'Redigera bok' : 'Lägg till ny bok' }}
  </h2>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Titel</label>
      <input type="text" class="form-control" name="title" [(ngModel)]="book.title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Författare</label>
      <input type="text" class="form-control" name="author" [(ngModel)]="book.author" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Publiceringsdatum</label>
      <input type="date" class="form-control" name="publishedDate" [(ngModel)]="book.publishedDate" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Spara</button>
      <a routerLink="/books" class="btn btn-secondary">Avbryt</a>
    </div>
  </form>
</div>
