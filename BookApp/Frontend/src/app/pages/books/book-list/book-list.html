<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-book"></i> Böcker</h2>
    <a routerLink="/books/new" class="btn btn-primary">
      <i class="fa-solid fa-plus"></i> Lägg till ny bok
    </a>
  </div>

  <div class="alert alert-info" *ngIf="books.length === 0">
    Inga böcker tillagda än.
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-lg-4" *ngFor="let book of books">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ book.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
          <p class="card-text">
            <i class="fa-regular fa-calendar"></i> {{ book.publishedDate | date:'yyyy-MM-dd' }}
          </p>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <a [routerLink]="['/books/edit', book.id]" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-pen"></i> Redigera
          </a>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteBook(book.id!)">
            <i class="fa-solid fa-trash"></i> Radera
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
